<div class="gallery">
  <div class="gallery__main">
    <img
      [src]="activeImage()"
      [alt]="alt() + ' — imagen ' + (activeIndex() + 1) + ' de ' + images().length"
      fetchpriority="high"
    />

    @if (hasMany()) {
      <button type="button" class="gallery__nav gallery__nav--prev" aria-label="Imagen anterior" (click)="step(-1)">
        ‹
      </button>
      <button type="button" class="gallery__nav gallery__nav--next" aria-label="Imagen siguiente" (click)="step(1)">
        ›
      </button>
      <span class="gallery__counter">{{ activeIndex() + 1 }} / {{ images().length }}</span>
    }
  </div>

  @if (hasMany()) {
    <ul class="gallery__thumbs" aria-label="Miniaturas">
      @for (image of images(); track image; let i = $index) {
        <li>
          <button
            type="button"
            class="gallery__thumb"
            [class.is-active]="i === activeIndex()"
            [attr.aria-current]="i === activeIndex()"
            [attr.aria-label]="'Ver imagen ' + (i + 1)"
            (click)="select(i)"
          >
            <img [src]="image" alt="" loading="lazy" />
          </button>
        </li>
      }
    </ul>
  }
</div>
