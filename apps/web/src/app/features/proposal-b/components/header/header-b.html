<header class="header">
  <div class="pb-container header__inner">
    <a class="logo" [routerLink]="paths.home" aria-label="Ochoa Parts, ir al inicio">
      <img src="propuesta-a/logo-ochoa-parts.jpeg" alt="Ochoa Parts Automation" width="110" height="41" />
    </a>

    <nav class="nav" [class.is-open]="menuOpen()" aria-label="Principal">
      <div class="nav__group">
        <span class="nav__label">¿Qué necesitas medir?</span>
        <ul class="nav__variables">
          @for (category of categories(); track category.slug) {
            <li>
              <a
                [routerLink]="paths.catalog"
                [queryParams]="{ cat: category.slug }"
                (click)="menuOpen.set(false)"
              >
                {{ category.name }}
              </a>
            </li>
          }
        </ul>
      </div>
      <a class="nav__link" [routerLink]="paths.home" fragment="marcas" (click)="menuOpen.set(false)">Marcas</a>
      <a class="nav__link" [routerLink]="paths.home" fragment="asesoria" (click)="menuOpen.set(false)">Asesoría</a>
      <a class="nav__link" [routerLink]="paths.home" fragment="descargas" (click)="menuOpen.set(false)">Descargas</a>
    </nav>

    <div class="actions">
      <form
        class="search"
        role="search"
        [class.is-open]="searchOpen()"
        (submit)="$event.preventDefault(); search(term.value)"
      >
        <label class="sr-only" for="pb-search">Buscar por referencia o producto</label>
        <input id="pb-search" #term type="search" placeholder="Referencia, modelo o marca" autocomplete="off" />
        <button type="submit" aria-label="Buscar"><app-icon name="search" [size]="18" /></button>
      </form>
      <button
        type="button"
        class="icon-btn search-toggle"
        aria-label="Abrir búsqueda"
        [attr.aria-expanded]="searchOpen()"
        (click)="searchOpen.set(!searchOpen())"
      >
        <app-icon name="search" />
      </button>
      <button type="button" class="icon-btn" aria-label="Pedido, 3 productos">
        <app-icon name="cart" />
        <span class="icon-btn__badge" aria-hidden="true">3</span>
      </button>
      <button type="button" class="login">Ingresar</button>
      <button
        type="button"
        class="icon-btn menu-toggle"
        aria-label="Abrir menú"
        [attr.aria-expanded]="menuOpen()"
        (click)="menuOpen.set(!menuOpen())"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'list'" />
      </button>
    </div>
  </div>
</header>
